syntax = "proto3";

package notification;

import "notification/enum.proto";

message Notification {
  string id = 1;
  string recipient_id = 2;
  RecipientType recipient_type = 3;
  NotificationChannel channel = 4;
  string title = 5;
  string body = 6;
  NotificationStatus status = 7;
  string created_at = 8;
  string read_at = 9;
}

message SendNotificationRequest {
  string recipient_id = 1;
  RecipientType recipient_type = 2;
  NotificationChannel channel = 3;
  string title = 4;
  string body = 5;
}

message SendNotificationResponse {
  string code = 1;
  string message = 2;
  Notification notification = 3;
}

message GetNotificationRequest {
  string notification_id = 1;
}

message GetNotificationResponse {
  string code = 1;
  string message = 2;
  Notification notification = 3;
}

message GetNotificationsByRecipientRequest {
  string recipient_id = 1;
}

message GetNotificationsByRecipientResponse {
  repeated Notification notifications = 1;
}

message MarkAsReadRequest {
  string notification_id = 1;
}

message MarkAsReadResponse {
  string code = 1;
  string message = 2;
  Notification notification = 3;
}

message GetUnreadCountRequest {
  string recipient_id = 1;
}

message GetUnreadCountResponse {
  int32 unread_count = 1;
}
