syntax = "proto3";

package users;

message GetProductsRequest {
  string farm_id = 1;
}

message GetProductsResponse {
  repeated Products product = 1;
}

message AddFarmProductRequest {
  string farm_id = 1;
  string product_name = 2;
  string category = 3;
  string product_type = 4;
  string description = 5;
  double quantity = 6;
  string unit = 7;
  double price_per_unit = 8;
  string harvest_date = 9;
  string expiry_date = 10;
  bool is_available = 11;
}

message AddFarmProductResponse {
  string code = 1;
  string message = 2;
}

message Products {
  string id = 1;
  string name = 2;
  string category = 3;
  string type = 4;
  double quantity = 5;
  string unit = 6;
  double price_per_unit = 7;
  bool is_available = 8;
}
